.foot{margin-top:22px;color:var(--mut);font-size:.9rem;text-align:center;line-height:1.75}
.foot a{color:var(--gold);text-decoration:none;font-weight:700}

  $('tk').src=cv.toDataURL('image/png');$('tk').hidden=false;
  $('sub').textContent='Folio '+folio(v.id)+' · '+v.fecha+' · '+money(v.total+(v.propina||0))+'. Guárdelo en su celular ✨';
  $('acts').hidden=false;$('tip').hidden=false;
  $('ver').hidden=false;$('ver').textContent='Código de verificación '+v.hash.slice(0,4)+'-'+v.hash.slice(4,8)+'. Con el folio y este código, la cafetería puede confirmar que su comprobante es auténtico.';
  const name='comprobante-aroma-'+String(v.id).padStart(6,'0')+'.png';
  cv.toBlob(b=>{if(!b)return;FILE=new File([b],name,{type:'image/png'});
    try{if(navigator.canShare&&navigator.canShare({files:[FILE]}))$('share').hidden=false;}catch(e){}},'image/png');
  $('save').onclick=()=>{const a=document.createElement('a');a.download=name;a.href=FILE?URL.createObjectURL(FILE):$('tk').src;document.body.appendChild(a);a.click();a.remove();};
  $('share').onclick=async()=>{if(!FILE)return;try{await navigator.share({files:[FILE],title:'Comprobante Aroma a Café'});}catch(e){}};
}
main();
window.addEventListener('hashchange',()=>location.reload());
</script>
</body>
</html>
